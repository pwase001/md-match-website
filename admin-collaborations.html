<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MD-Match — Collaborations Admin</title>
<link rel="canonical" href="https://www.md-match.com/admin-collaborations.html">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f0f4f4;
    color: #1a3333;
    padding: 2rem 1rem 4rem;
    font-size: 14px;
  }
  .page { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.3rem; color: #0b3535; margin-bottom: 0.3rem; }
  .subtitle { color: #4a6b6b; font-size: 13px; margin-bottom: 2rem; }

  .card {
    background: white;
    border-radius: 8px;
    padding: 1.5rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    margin-bottom: 1.5rem;
  }
  .card-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #1a6b6b;
    margin-bottom: 1rem;
  }

  input, select, textarea {
    padding: 0.5rem 0.7rem;
    border: 1.5px solid #d0e2e2;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: #1a3333;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
  }
  input:focus, select:focus, textarea:focus { border-color: #1a6b6b; }
  label { font-size: 12px; font-weight: 600; color: #4a6b6b; display: block; margin-bottom: 0.3rem; }
  .field { margin-bottom: 0.9rem; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

  .btn {
    background: #0b3535;
    color: white;
    border: none;
    padding: 0.7rem 1.6rem;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #1a6b6b; }
  .btn:disabled { background: #aaa; cursor: default; }
  .btn-small { padding: 0.4rem 0.9rem; font-size: 12px; }

  /* Action cells stack their buttons so each column reads as a short list
     rather than one long wrapping row. */
  td.actions { white-space: nowrap; vertical-align: top; }
  td.actions .btn { display: block; width: 100%; margin-bottom: 0.3rem; }
  td.actions .btn:last-child { margin-bottom: 0; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid #eef2f2; }
  th { color: #4a6b6b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
  .badge { padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 11px; font-weight: 700; }
  .badge.pending_setup { background: #fdf3e3; color: #a06a00; }
  .badge.active { background: #f0faf0; color: #1a7a1a; }
  .badge.canceled { background: #fdf5f3; color: #c0392b; }
  .badge.ready { background: #f0faf0; color: #1a7a1a; }
  .badge.notready { background: #fdf5f3; color: #c0392b; }

  #loginCard { max-width: 360px; margin: 4rem auto; }
  #app { display: none; }
  .msg { font-size: 13px; margin-top: 0.6rem; }
  .msg.err { color: #c0392b; }
  .msg.ok { color: #1a7a1a; }
</style>
</head>
<body>
<div class="page">

  <div class="card" id="loginCard">
    <div class="card-title">Admin Login</div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" onkeydown="if(event.key==='Enter') login()">
    </div>
    <button class="btn" onclick="login()">Log In</button>
    <div class="msg err" id="loginMsg"></div>
  </div>

  <div id="app">
    <h1>Collaborations</h1>
    <p class="subtitle">Match a client with a physician to kick off payout onboarding and bank-account setup.</p>

    <div class="card">
      <div class="card-title">Create Collaboration</div>
      <div class="field-row">
        <div class="field">
          <label>Client (NP/PA)</label>
          <select id="clientSelect"></select>
        </div>
        <div class="field">
          <label>Collaborating Physician</label>
          <select id="physicianSelect"></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Physician Payout (USD/month)</label>
          <input type="number" id="physicianPayout" placeholder="700" min="1" step="0.01" oninput="updateAmountPreview()">
        </div>
        <div class="field">
          <label>Your Fee, after Stripe (USD/month)</label>
          <input type="number" id="netFee" value="200" min="1" step="0.01" oninput="updateAmountPreview()">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Who pays Stripe's fees?</label>
          <select id="stripeFeeShare" onchange="updateAmountPreview()">
            <option value="1" selected>Client pays them — you keep your full fee</option>
            <option value="0.5">Split them with the client</option>
            <option value="0">You absorb them — client pays payout + fee exactly</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <div id="amountPreview" style="display:none;padding:10px 12px;border-left:2px solid #2E6B5E;background:#EDF3F0;font-size:13px;line-height:1.6"></div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Billing Start Date</label>
          <input type="date" id="startDate">
        </div>
        <div class="field">
          <label>Payment Terms</label>
          <select id="paymentTerms">
            <option value="7">Net 7 — due in 7 days</option>
            <option value="14" selected>Net 14 — due in 14 days</option>
            <option value="30">Net 30 — due in 30 days</option>
            <option value="45">Net 45 — due in 45 days</option>
            <option value="60">Net 60 — due in 60 days</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>NP/PA Name (optional)</label>
          <input type="text" id="providerName" placeholder="Who the physician is collaborating with">
        </div>
        <div class="field">
          <label>Notes (optional)</label>
          <input type="text" id="notes" placeholder="Specialty, agreement details, etc.">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label style="font-weight:normal">
            <input type="checkbox" id="hasPromo" onchange="togglePromo()"> Introductory rate for an opening period
          </label>
        </div>
      </div>
      <div class="field-row" id="promoFields" style="display:none">
        <div class="field">
          <label>Client Pays During Intro (USD/month)</label>
          <input type="number" id="promoTotal" placeholder="350" step="0.01">
        </div>
        <div class="field">
          <label>Physician Payout During Intro (USD/month)</label>
          <input type="number" id="promoPayout" placeholder="250" step="0.01">
        </div>
        <div class="field">
          <label>Intro Rate Ends</label>
          <input type="date" id="promoEndDate">
        </div>
      </div>
      <button class="btn" id="createBtn" onclick="createCollaboration()">Create &amp; Send Setup Emails</button>
      <div class="msg" id="createMsg"></div>
    </div>

    <div class="card">
      <div class="card-title">Monthly Billing</div>
      <div id="billingPanel" style="font-size:13px;line-height:1.7">Loading…</div>
      <button class="btn btn-small" style="margin-top:0.8rem" id="runBillingBtn" onclick="runBilling()">Run billing now</button>
      <div class="msg" id="billingMsg"></div>
    </div>

    <div class="card">
      <div class="card-title">All Collaborations</div>
      <table>
        <thead>
          <tr>
            <th>Client</th><th>Physician</th><th>Total</th><th>Fee</th><th>Start</th><th>Terms</th>
            <th>Physician Payout</th><th>Status</th><th>Actions</th><th>Resend</th>
          </tr>
        </thead>
        <tbody id="collabRows"></tbody>
      </table>
    </div>
  </div>

</div>
<script>
  async function login() {
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    msg.textContent = '';
    try {
      const res = await fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ password }),
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        loadData();
      } else {
        msg.textContent = data.error || 'Login failed';
      }
    } catch {
      msg.textContent = 'Network error';
    }
  }

  function money(cents) { return '$' + (cents / 100).toFixed(2); }

  // Display-only mirror of the rates in src/stripe-helpers.js, which stays the
  // source of truth -- the server recomputes these figures on submit. Duplicated
  // rather than fetched so the preview updates as you type, but they are money:
  // change both together.
  const STRIPE_ACH_PERCENT = 0.008, STRIPE_ACH_CAP_CENTS = 500,
        STRIPE_BILLING_PERCENT = 0.007, STRIPE_RADAR_CENTS = 5;

  function estimateStripeFeeCents(total) {
    return Math.min(Math.round(total * STRIPE_ACH_PERCENT), STRIPE_ACH_CAP_CENTS)
      + Math.round(total * STRIPE_BILLING_PERCENT) + STRIPE_RADAR_CENTS;
  }

  function grossUpTotalCents(payout, netFee, share) {
    let total = payout + netFee;
    for (let i = 0; i < 8; i++) {
      const next = payout + netFee + Math.round(estimateStripeFeeCents(total) * share);
      if (next === total) break;
      total = next;
    }
    return total;
  }

  function updateAmountPreview() {
    const el = document.getElementById('amountPreview');
    const payout = Math.round(Number(document.getElementById('physicianPayout').value) * 100);
    const netFee = Math.round(Number(document.getElementById('netFee').value) * 100);
    if (!payout || !netFee || payout < 0 || netFee < 0) { el.style.display = 'none'; return; }

    const share = Number(document.getElementById('stripeFeeShare').value);
    const total = grossUpTotalCents(payout, netFee, share);
    const stripeFee = estimateStripeFeeCents(total);
    const net = (total - payout) - stripeFee;
    const clientShare = Math.round(stripeFee * share);

    el.style.display = 'block';
    el.innerHTML = `Client is invoiced <b>${money(total)}</b> per month.<br>`
      + `Physician receives ${money(payout)} &middot; Stripe takes about ${money(stripeFee)} `
      + `&middot; you keep about <b>${money(net)}</b>`
      + (share > 0 && share < 1
          ? `<br><span style="opacity:.75">Of Stripe's ${money(stripeFee)}, the client covers `
            + `${money(clientShare)} and you cover ${money(stripeFee - clientShare)}.</span>`
          : '');
  }

  async function loadBilling() {
    const el = document.getElementById('billingPanel');
    try {
      const res = await fetch('/admin/api/billing/preview', { credentials: 'include' });
      const data = await res.json();
      if (!data.success) { el.textContent = data.error || 'Could not load billing status.'; return; }

      let html = '';
      if (data.failed.length) {
        html += `<div style="padding:10px 12px;margin-bottom:10px;border-left:2px solid #c0392b;background:#fdf5f3">`
          + `<b>${data.failed.length} month${data.failed.length > 1 ? 's' : ''} failed and ${data.failed.length > 1 ? 'are' : 'is'} blocking billing.</b><br>`
          + data.failed.map(f =>
              `${f.client_name} / ${f.physician_name} — ${f.period}: ${f.error}<br>`
              + `<span style="opacity:.8">Check Stripe for an invoice dated ${f.period}. If there is none, </span>`
              + `<button class="btn btn-small" onclick="clearFailure(${f.collaboration_id}, '${f.period}', this)">clear and retry</button>`
            ).join('<br>')
          + `</div>`;
      }
      html += data.due.length
        ? `<b>Due today (${data.today}):</b><br>` + data.due.map(c =>
            `${c.client_name} / ${c.physician_name} — ${money(c.total_amount_cents)}, due date ${c.next_invoice_date}`
          ).join('<br>')
        : `Nothing due today (${data.today}).`;
      el.innerHTML = html;
    } catch {
      el.textContent = 'Network error loading billing status.';
    }
  }

  async function runBilling() {
    const btn = document.getElementById('runBillingBtn');
    const msg = document.getElementById('billingMsg');
    btn.disabled = true;
    msg.className = 'msg';
    msg.textContent = 'Running…';
    try {
      const res = await fetch('/admin/api/billing/run', { method: 'POST', credentials: 'include' });
      const data = await res.json();
      const issued = (data.results || []).filter(r => r.invoiceId);
      const failed = (data.results || []).filter(r => r.error);
      msg.className = failed.length ? 'msg err' : 'msg ok';
      msg.textContent = `${issued.length} invoice(s) issued`
        + (failed.length ? `, ${failed.length} failed — see above` : '')
        + ((data.results || []).length ? '' : ' — nothing was due');
      loadBilling();
      loadData();
    } catch {
      msg.className = 'msg err';
      msg.textContent = 'Network error';
    }
    btn.disabled = false;
  }

  async function clearFailure(collaborationId, period, btn) {
    if (!confirm(`Clear the failed ${period} month for collaboration ${collaborationId}?\n\n`
      + `Only do this if you have checked Stripe and there is NO invoice for that month. `
      + `Clearing it lets billing try again, which would bill twice if one already exists.`)) return;
    btn.disabled = true;
    await fetch('/admin/api/billing/clear-failure', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ collaborationId, period }),
    });
    loadBilling();
  }

  function togglePromo() {
    const on = document.getElementById('hasPromo').checked;
    document.getElementById('promoFields').style.display = on ? 'flex' : 'none';
  }

  async function loadData() {
    const res = await fetch('/admin/api/data', { credentials: 'include' });
    if (res.status === 401) {
      document.getElementById('loginCard').style.display = 'block';
      document.getElementById('app').style.display = 'none';
      return;
    }
    const data = await res.json();
    // Refreshed alongside the table, so a failed month is on screen the next time
    // the page is opened rather than waiting to be looked for.
    loadBilling();

    const clientSelect = document.getElementById('clientSelect');
    clientSelect.innerHTML = data.clients.map(c => `<option value="${c.id}">${c.full_name} (${c.email})</option>`).join('');

    const physicianSelect = document.getElementById('physicianSelect');
    physicianSelect.innerHTML = data.physicians.map(p => `<option value="${p.id}">${p.full_name} (${p.email})</option>`).join('');

    const rows = data.collaborations.map(c => `
      <tr>
        <td>${c.client_name}</td>
        <td>${c.physician_name}</td>
        <td>${money(c.total_amount_cents)}</td>
        <td>${money(c.platform_fee_cents)}</td>
        <td>${c.start_date}${c.promo_end_date ? `<div style="font-size:11px;opacity:.7">intro until ${c.promo_end_date}: client ${money(c.promo_total_cents)}, physician ${money(c.promo_payout_cents)}</div>` : ''}${c.billing_mode === 'app_invoice' && c.next_invoice_date ? `<div style="font-size:11px;opacity:.7">next invoice ${c.next_invoice_date}</div>` : ''}</td>
        <td>Net ${c.payment_terms_days ?? 14}</td>
        <td><span class="badge ${c.transfers_active ? 'ready' : 'notready'}">${c.transfers_active ? 'Ready' : 'Pending'}</span></td>
        <td><span class="badge ${c.status}">${c.status}</span></td>
        <td class="actions">
          ${c.status === 'pending_setup' ? `<button class="btn btn-small" onclick="activate(${c.id}, this)">Activate</button>` : ''}
          ${c.status !== 'canceled' ? `<button class="btn btn-small" onclick="cancelCollaboration(${c.id}, ${!!c.stripe_subscription_id}, this)" title="End this collaboration">Cancel</button>` : ''}
        </td>
        <td class="actions">
          ${!c.transfers_active && c.status !== 'canceled' ? `<button class="btn btn-small" onclick="resendOnboarding(${c.id}, this)" title="Email the physician a fresh payout setup link">Resend Link Physician</button>` : ''}
          ${c.status !== 'canceled' ? `<button class="btn btn-small" onclick="resendClientEmail(${c.id}, this)" title="Re-send the client their billing confirmation">Resend Link Client</button>` : ''}
        </td>
      </tr>
    `).join('');
    document.getElementById('collabRows').innerHTML = rows || '<tr><td colspan="10">No collaborations yet.</td></tr>';
  }

  async function createCollaboration() {
    const btn = document.getElementById('createBtn');
    const msg = document.getElementById('createMsg');
    msg.className = 'msg';
    msg.textContent = '';

    const body = {
      clientId: Number(document.getElementById('clientSelect').value),
      physicianId: Number(document.getElementById('physicianSelect').value),
      physicianPayoutUsd: document.getElementById('physicianPayout').value,
      netFeeUsd: document.getElementById('netFee').value,
      stripeFeeShare: Number(document.getElementById('stripeFeeShare').value),
      startDate: document.getElementById('startDate').value,
      paymentTermsDays: Number(document.getElementById('paymentTerms').value),
      providerName: document.getElementById('providerName').value,
      notes: document.getElementById('notes').value,
    };
    // Sent only when the box is ticked, so clearing it discards whatever was typed
    // rather than quietly applying an introductory rate nobody meant to set.
    if (document.getElementById('hasPromo').checked) {
      body.promoTotalUsd = document.getElementById('promoTotal').value;
      body.promoPayoutUsd = document.getElementById('promoPayout').value;
      body.promoEndDate = document.getElementById('promoEndDate').value;
      if (!body.promoTotalUsd || !body.promoPayoutUsd || !body.promoEndDate) {
        msg.className = 'msg err';
        msg.textContent = 'Introductory rate needs the client amount, the physician payout, and an end date.';
        return;
      }
    }
    if (!body.clientId || !body.physicianId || !body.physicianPayoutUsd || !body.netFeeUsd || !body.startDate) {
      msg.className = 'msg err';
      msg.textContent = 'Please fill in client, physician, physician payout, your fee, and start date.';
      return;
    }

    btn.disabled = true;
    try {
      const res = await fetch('/admin/api/collaborations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify(body),
      });
      const data = await res.json();
      if (data.success) {
        msg.className = 'msg ok';
        msg.textContent = 'Collaboration created — onboarding emails sent to physician and client.';
        loadData();
      } else {
        msg.className = 'msg err';
        msg.textContent = data.error || 'Failed to create collaboration';
      }
    } catch {
      msg.className = 'msg err';
      msg.textContent = 'Network error';
    }
    btn.disabled = false;
  }

  async function resendClientEmail(id, btn) {
    await resendEmail('/admin/api/collaborations/resend-client-email', id, btn, 'Billing confirmation re-sent to ');
  }

  async function resendEmail(endpoint, id, btn, successPrefix) {
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Sending...';
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ collaborationId: id }),
      });
      const data = await res.json();
      if (data.success) {
        btn.textContent = 'Sent';
        alert(successPrefix + data.email);
      } else {
        btn.textContent = original;
        btn.disabled = false;
        alert((data.error || 'Failed to resend') + (data.detail ? '\n\n' + data.detail : ''));
      }
    } catch {
      btn.textContent = original;
      btn.disabled = false;
      alert('Network error');
    }
  }

  async function cancelCollaboration(id, hasSubscription, btn) {
    // An activated collaboration is billing someone, so say so plainly rather
    // than asking a generic "are you sure".
    const warning = hasSubscription
      ? 'This will cancel the Stripe subscription and stop all future invoices.\n\nAlready-issued invoices stay open and remain payable.'
      : 'This collaboration was never activated, so nothing is billing. It will be marked cancelled.';
    if (!confirm(warning + '\n\nContinue?')) return;

    btn.disabled = true;
    btn.textContent = 'Cancelling...';
    try {
      const res = await fetch('/admin/api/collaborations/cancel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ collaborationId: id }),
      });
      const data = await res.json();
      if (!data.success) {
        alert((data.error || 'Failed to cancel') + (data.detail ? '\n\n' + data.detail : ''));
        btn.disabled = false;
        btn.textContent = 'Cancel';
      }
      loadData();
    } catch {
      alert('Network error');
      btn.disabled = false;
      btn.textContent = 'Cancel';
    }
  }

  async function resendOnboarding(id, btn) {
    await resendEmail('/admin/api/collaborations/resend-onboarding', id, btn, 'Payout setup link re-sent to ');
  }

  async function activate(id, btn) {
    btn.disabled = true;
    try {
      const res = await fetch('/admin/api/collaborations/activate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ collaborationId: id }),
      });
      const data = await res.json();
      if (!data.success) alert((data.error || 'Failed to activate') + (data.detail ? '\n\n' + data.detail : ''));
      loadData();
    } catch {
      alert('Network error');
      btn.disabled = false;
    }
  }

  // Try loading data immediately in case a valid session cookie already exists
  fetch('/admin/api/data', { credentials: 'include' }).then(res => {
    if (res.ok) {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadData();
    }
  });
</script>
</body>
</html>
